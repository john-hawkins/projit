[project]
name = "projit"
version = "0.1.13"
description = "Python library and CLI for de-coupled data science project integration and management."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "John Hawkins", email = "john@getting-data-science-done.com" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.16.4",
    "pandas>=0.25.3",
    "pyyaml",
    "fpdf",
    "gitpython",
    "setuptools",
]

[project.urls]
Homepage = "http://john-hawkins.github.io"
Documentation = "https://projit.readthedocs.io"
Source = "https://github.com/john-hawkins/projit"
Tracker = "https://github.com/john-hawkins/projit/issues"

[project.scripts]
projit = "projit.cli:main"

[dependency-groups]
dev = [
    "pytest>=7",
    "datatest>=0.11.1",
    "pytest-cov>=4",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["projit*"]

[tool.setuptools.package-data]
projit = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
